name: Dependency review

on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Block known-vulnerable or non-FOSS-compatible additions at PR time.
          # GitHub reads app/requirements.txt statically for the graph.
          fail-on-severity: high
          # Copyleft licences incompatible with redistributing an Apache-2.0
          # APK. LGPL is included: a packaged Android build bundles everything.
          deny-licenses: GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0, AGPL-1.0, AGPL-3.0
