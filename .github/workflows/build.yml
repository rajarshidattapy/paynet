name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    name: secret scan + pytest
    runs-on: ubuntu-latest

    # Declaring `permissions` at all sets every scope not listed here to
    # `none`. The top-level block grants only `contents: read`, which left
    # `pull-requests: none` — and the secret scan below needs to enumerate a
    # PR's commits. Granted at job level, read-only, so the rest of the job
    # keeps least privilege.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # gitleaks scans full history

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Reading the PR's commit list needs `pull-requests: read` (granted
          # above). Posting the findings comment needs `pull-requests: write`,
          # which a PR from Dependabot or a fork never gets, so the comment is
          # switched off rather than left to fail. Findings still fail the
          # step and are printed in the job log and the run summary.
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kivy/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r kivy/requirements.txt

      - name: Check for PII in log statements
        run: |
          # Payment-critical code must never interpolate raw SMS bodies into
          # logs. Catches reintroductions at CI time.
          ! grep -rnE '(log|logger|Logger)\.(debug|info|warning|error|exception)\(.*\b(body|raw_message|message_body)\b' \
            kivy/paynet/payment kivy/paynet/sms kivy/paynet/overlay \
            || (echo "::error::Log statement leaks SMS body content" && exit 1)

      - name: Run tests
        working-directory: kivy
        env:
          KIVY_NO_ARGS: "1"
          KIVY_NO_CONSOLELOG: "1"
        # Kivy widgets need a display even in tests; xvfb provides one.
        run: xvfb-run -a python -m pytest tests -q
